<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Assisted pull-up technique</title><desc id="d">Start and finish positions on an assisted pull-up machine with latissimus dorsi highlighted.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient><style>.tx{font:700 26px system-ui;fill:#10151d}.sm{font:500 18px system-ui;fill:#3e4a5b}.cue{font:700 18px system-ui;fill:#1d5fd0}.machine{stroke:#555f6d;stroke-width:18;fill:none;stroke-linecap:round}.cable{stroke:#8a94a3;stroke-width:5;fill:none}.skin{fill:#b97e5c;stroke:#744b38;stroke-width:3}.shirt{fill:#111820;stroke:#0a0e12;stroke-width:3}.shorts{fill:#171d26}.lat{fill:#6dbb3b;stroke:#43821f;stroke-width:2;opacity:.95}.limb{stroke:#b97e5c;stroke-width:24;fill:none;stroke-linecap:round}.joint{fill:#b97e5c}.arrow{stroke:#2d72e8;stroke-width:9;fill:none;marker-end:url(#m)}.pad{fill:#262e39;stroke:#111820;stroke-width:4}.label{fill:#fff;stroke:#d9e0e9;stroke-width:2}.divider{stroke:#d7dde6;stroke-width:3}.primary{fill:#eff8e8;stroke:#83bf59;stroke-width:2}</style><marker id="m" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0 0L12 5L0 10Z" fill="#2d72e8"/></marker></defs><rect width="1200" height="620" rx="28" fill="url(#bg)"/><text x="42" y="48" class="tx">ASSISTED PULL-UP — START → FINISH</text><line x1="600" y1="76" x2="600" y2="580" class="divider"/><text x="245" y="95" class="cue">START • FULL STRETCH</text><text x="790" y="95" class="cue">FINISH • CHEST HIGH</text><!-- machines --><g transform="translate(50 80)"><path d="M80 470V80M440 470V80M80 90H440M120 470H400" class="machine"/><path d="M120 470V520M400 470V520" class="machine"/><rect x="205" y="386" width="110" height="54" rx="18" class="pad"/><path d="M185 91H335" class="machine"/><path d="M170 92Q150 75 135 104M350 92Q370 75 385 104" class="machine"/><path d="M95 400H155M365 400H425" class="cable"/><circle cx="260" cy="175" r="30" class="skin"/><path d="M220 210Q260 190 300 210L315 345Q260 375 205 345Z" class="shirt"/><path d="M220 235L168 135M300 235L352 135" class="limb"/><circle cx="166" cy="133" r="14" class="joint"/><circle cx="354" cy="133" r="14" class="joint"/><path d="M218 252Q190 275 186 315Q205 300 222 292Z" class="lat"/><path d="M302 252Q330 275 334 315Q315 300 298 292Z" class="lat"/><path d="M217 345L205 420M303 345L315 420" class="limb"/><rect x="195" y="333" width="130" height="70" rx="22" class="shorts"/><path d="M205 420Q230 445 260 425Q290 445 315 420" fill="none" stroke="#d7dde6" stroke-width="4"/><path d="M258 130V75" class="arrow"/><rect x="12" y="8" width="180" height="66" rx="14" class="label"/><text x="28" y="36" class="sm">Grip: palms away</text><text x="28" y="60" class="sm">slightly wider than shoulders</text><rect x="330" y="445" width="180" height="72" rx="14" class="primary"/><text x="344" y="474" class="sm">PRIMARY</text><text x="344" y="500" class="sm">Latissimus dorsi</text></g><g transform="translate(650 80)"><path d="M80 470V80M440 470V80M80 90H440M120 470H400" class="machine"/><path d="M120 470V520M400 470V520" class="machine"/><rect x="205" y="386" width="110" height="54" rx="18" class="pad"/><path d="M185 91H335" class="machine"/><path d="M170 92Q150 75 135 104M350 92Q370 75 385 104" class="machine"/><path d="M95 400H155M365 400H425" class="cable"/><circle cx="260" cy="180" r="30" class="skin"/><path d="M220 215Q260 195 300 215L315 350Q260 380 205 350Z" class="shirt"/><path d="M222 238L175 148M298 238L345 148" class="limb"/><circle cx="174" cy="146" r="14" class="joint"/><circle cx="346" cy="146" r="14" class="joint"/><path d="M218 250Q184 272 182 325Q207 303 225 290Z" class="lat"/><path d="M302 250Q336 272 338 325Q313 303 295 290Z" class="lat"/><path d="M218 350L208 420M302 350L312 420" class="limb"/><rect x="195" y="338" width="130" height="70" rx="22" class="shorts"/><path d="M206 420Q232 445 260 426Q288 445 314 420" fill="none" stroke="#d7dde6" stroke-width="4"/><path d="M260 270V205" class="arrow"/><rect x="10" y="8" width="180" height="66" rx="14" class="label"/><text x="26" y="36" class="sm">Drive elbows down</text><text x="26" y="60" class="sm">toward your ribs</text><rect x="330" y="445" width="190" height="72" rx="14" class="primary"/><text x="344" y="474" class="sm">SQUEEZE</text><text x="344" y="500" class="sm">Lats • 1 sec at top</text></g><text x="43" y="594" class="sm">Shoulders stay down • chest slightly lifted • knees remain on assistance pad • no swinging • lower for 2–3 seconds</text></svg>